name: W7 Preview

on:
  push:
    branches:
      - wayfinder-w7-communities-people

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hobbies:hobbies@localhost:5432/hobbies_dev
      JWT_SECRET: ci-preview-only-secret-0000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm exec prettier --write "{src,test,prisma,scripts}/**/*.ts" "docs/**/*.md"
      - run: pnpm openapi:generate
      - name: Stage refreshed files
        run: |
          mkdir -p /tmp/w7-preview/prisma/seed-data
          mkdir -p /tmp/w7-preview/src/modules/community/application/ports
          mkdir -p /tmp/w7-preview/src/modules/community/infrastructure
          mkdir -p /tmp/w7-preview/src/modules/community/interface/dto
          mkdir -p /tmp/w7-preview/src/modules/community/interface/presenters
          mkdir -p /tmp/w7-preview/openapi
          cp prisma/seed-data/activities.ts /tmp/w7-preview/prisma/seed-data/activities.ts
          cp src/modules/community/application/community.use-cases.ts /tmp/w7-preview/src/modules/community/application/community.use-cases.ts
          cp src/modules/community/application/ports/community.repository.port.ts /tmp/w7-preview/src/modules/community/application/ports/community.repository.port.ts
          cp src/modules/community/infrastructure/prisma-community.repository.ts /tmp/w7-preview/src/modules/community/infrastructure/prisma-community.repository.ts
          cp src/modules/community/interface/community.controller.ts /tmp/w7-preview/src/modules/community/interface/community.controller.ts
          cp src/modules/community/interface/dto/community.dto.ts /tmp/w7-preview/src/modules/community/interface/dto/community.dto.ts
          cp src/modules/community/interface/presenters/community.presenter.ts /tmp/w7-preview/src/modules/community/interface/presenters/community.presenter.ts
          cp openapi/openapi.json /tmp/w7-preview/openapi/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: w7-refreshed-files
          path: /tmp/w7-preview
