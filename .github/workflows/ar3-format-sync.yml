name: AR3 format sync

on:
  push:
    branches: [wayfinder-alpha-readiness-ar3]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write src/infrastructure/http/filters/app-exception.filter.spec.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/http/filters/app-exception.filter.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(readiness): apply AR3 formatter output"
          git push
