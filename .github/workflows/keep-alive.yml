# Keeps the free Supabase staging database from auto-pausing after a week
# without traffic (ADR-0028). /health/ready runs a real PostgreSQL and Redis
# check, so one successful call counts as database activity.
name: Staging keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || 'https://hobbies-platform-backend.vercel.app/health/ready' }}
    steps:
      - name: Call readiness endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 30 "$HEALTH_URL"
