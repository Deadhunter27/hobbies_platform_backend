name: W9 Contract Preview

on:
  push:
    branches:
      - wayfinder-w9-conversations-feed

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hobbies:hobbies@localhost:5432/hobbies_dev
      JWT_SECRET: local-ci-placeholder-value-0000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm openapi:generate
      - uses: actions/upload-artifact@v4
        with:
          name: w9-openapi
          path: openapi/openapi.json
