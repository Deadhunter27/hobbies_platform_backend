name: AR2 Sync Lock

on:
  push:
    branches: [wayfinder-ar2-redis-rate-limit]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayfinder-ar2-redis-rate-limit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --lockfile-only
      - name: Commit lockfile when changed
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): sync AR2 lockfile"
          git push origin HEAD:wayfinder-ar2-redis-rate-limit
