name: W4 finalize generated files

on:
  push:
    branches: [feat/wayfinder-w4-activities]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hobbies:hobbies@localhost:5432/hobbies_dev
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-real-0000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wayfinder-w4-activities
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm format
      - run: pnpm openapi:generate
      - name: Commit generated and formatted W4 files
        run: |
          rm .github/workflows/w4-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(activity): format and refresh OpenAPI contract"
          git push origin HEAD:feat/wayfinder-w4-activities
