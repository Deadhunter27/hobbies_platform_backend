name: Format Preview

on:
  push:
    branches:
      - wayfinder-w5-recommendation

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Print formatter diff
        run: git diff -- src/modules/recommendation
