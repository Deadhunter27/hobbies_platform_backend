name: Wayfinder Contract Sync

on:
  push:
    branches: [wayfinder-v1-foundation]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hobbies:hobbies@localhost:5432/hobbies_dev
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-real-0000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm openapi:generate
      - run: pnpm prettier --write "src/modules/profile/**/*.ts"
      - name: Commit generated contract and formatting when changed
        run: |
          if git diff --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git config user.name "wayfinder-ci"
          git config user.email "wayfinder-ci@users.noreply.github.com"
          git add openapi/openapi.json src/modules/profile
          git commit -m "chore(profile): sync generated contracts"
          git push
