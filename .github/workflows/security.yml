# Repository security checks (ADR-0028). Replaces the CodeQL workflow, which
# GitHub does not offer for private repositories on a free personal account.
# Every tool and rule set is pinned so a PR result is reproducible locally.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories surface without a code change.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.28.0'
  GITLEAKS_SHA256: 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb'
  SEMGREP_RULES_REF: '17e31e11ebac99fb7dfe1cd288f7a32151b6f3f9'

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan every commit
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: semgrep/semgrep-rules
          ref: ${{ env.SEMGREP_RULES_REF }}
          path: .semgrep-rules
      - name: Drop rule fixtures
        run: find .semgrep-rules \( -name '*.test.*' -o -name '*.fixed.*' \) -delete
      - name: Scan application source
        # Reviewed false positives carry an inline `nosemgrep: <rule> -- <reason>`.
        run: >
          semgrep scan
          --config .semgrep-rules/typescript
          --config .semgrep-rules/javascript
          --severity ERROR --severity WARNING
          --exclude '*.spec.ts'
          --metrics=off --error
          src

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Report all production advisories
        run: pnpm audit --prod || true
      - name: Fail on critical production advisories
        run: pnpm audit --prod --audit-level critical
