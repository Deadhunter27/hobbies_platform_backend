name: W6 Contract Preview

on:
  push:
    branches:
      - wayfinder-w6-progress-journey

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hobbies:hobbies@localhost:5432/hobbies_dev
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-real-0000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm openapi:generate
      - name: Commit generated OpenAPI
        run: |
          if git diff --quiet -- openapi/openapi.json; then
            echo "OpenAPI contract already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/openapi.json
          git commit -m "docs(openapi): refresh W6 generated contract"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: w6-openapi
          path: openapi/openapi.json
