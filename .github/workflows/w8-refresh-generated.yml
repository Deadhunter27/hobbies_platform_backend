name: W8 Refresh Generated

on:
  push:
    branches:
      - wayfinder-w8-checkins

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hobbies:hobbies@localhost:5432/hobbies_dev
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-real-0000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Format W8 source
        run: pnpm prettier --write src/modules/checkin/application/checkin.use-cases.ts src/modules/checkin/interface/checkin.controller.ts src/modules/checkin/interface/dto/checkin.dto.ts src/modules/checkin/application/checkin.use-cases.spec.ts
      - run: pnpm openapi:generate
      - name: Commit refreshed W8 artifacts
        run: |
          if git diff --quiet; then
            echo "W8 source and generated contract already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/checkin openapi/openapi.json
          git commit -m "chore(checkin): refresh W8 formatting and contract"
          git push
